<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>외계어 악보</title>
  <link rel="stylesheet" href="./ui/styles.css">
  <script type="module" src="./ui/main.js"></script>
</head>
<body>
  <main class="app">
    <h1 class="app__title">외계어 악보</h1>

    <div class="editor">
      <div class="editor__backdrop" id="score-backdrop" aria-hidden="true"></div>
      <textarea class="editor__input" id="score" rows="3"
        placeholder="아무 키나 쳐보세요" aria-label="악보"
        autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
    </div>

    <div class="controls">
      <button class="button button--primary" id="play" type="button">
        &#9654;
        <span data-label="play">재생</span>
        <span data-label="listen" hidden>들어보기</span>
      </button>
      <button class="button button--primary" id="stop" type="button" hidden>&#9632; 정지</button>
      <button class="button" id="copy-score" type="button">악보 복사</button>
      <button class="button" id="copy-link" type="button">링크 복사</button>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <ul class="notices">
      <li id="notice-ios" hidden>소리가 안 나면 무음 모드를 확인해주세요.</li>
      <li id="notice-keyboard" hidden>쿼티(두벌식) 자판으로 쳐주세요. 천지인 자판은 음이 틀어져요.</li>
    </ul>
  </main>
</body>
</html>
